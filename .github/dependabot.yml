# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Sem `target-branch`: os PRs vão para a branch padrão (main).
# O ecossistema "npm" também cobre projetos com pnpm-lock.yaml.

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/backend"
      - "/frontend"
      - "/mobile"
    schedule:
      interval: "weekly"
    # Agrupa minor/patch em um PR por pasta, para não abrir dezenas de PRs por semana.
    # Majors continuam em PRs separados, porque podem quebrar algo e merecem revisão.
    groups:
      minor-e-patch:
        update-types: ["minor", "patch"]
    ignore:
      # No mobile, as versões são definidas pelo Expo SDK: suba de SDK com
      # `npx expo install expo@latest && npx expo install --fix`.
      # Atualizar react-native ou fazer major do expo por fora quebra a compatibilidade.
      - dependency-name: "react-native"
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
